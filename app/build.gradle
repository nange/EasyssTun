import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace = 'com.easysstun'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.easysstun"
        minSdk = 33
        targetSdk 37
        versionCode = 141
        versionName = "3.0.0-rc6"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    lint {
        checkDependencies = true
        textReport = true
    }

    buildTypes {
        debug {
            resValue "string", "app_name", "EasyssTun (Debug)"
            applicationIdSuffix = ".debug"
        }
        release {
            resValue "string", "app_name", "EasyssTun"
        }
    }

    splits {
        abi {
            enable = true
            reset()
            include "arm64-v8a"
            universalApk = false
        }
    }




    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
        resValues = true
    }
    ndkVersion = '25.0.8775105'
    composeOptions {
        kotlinCompilerExtensionVersion = '1.4.3'
    }
    buildToolsVersion '36.0.0'
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def abiFilter = output.filters.find { it.filterType.name() == 'ABI' }
            def abi = abiFilter != null ? abiFilter.identifier : 'all'
            def formattedDate = new Date().format('yyyyMMdd')
            output.outputFileName.set("EasyssTun_v${output.versionName.get()}_${output.versionCode.get()}_${abi}_${variant.name}_${formattedDate}.apk")
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

