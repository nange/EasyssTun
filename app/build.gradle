import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// 签名配置：优先读本地 keystore.properties，其次读 CI 环境变量
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def useLocalKeystore = keystorePropertiesFile.exists()
def useCiKeystore = System.getenv("KEYSTORE_PASSWORD") != null

if (useLocalKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// 版本号（手动维护 version.properties）
def versionPropsFile = rootProject.file("version.properties")
def versionProps = new Properties()
versionProps.load(new FileInputStream(versionPropsFile))

// libeasyss 版本锁定（可选）：配置后跳过 API 调用，直接从指定版本下载
def libeasyssVersion = versionProps.getProperty('libeasyssVersion')?.trim()

// hev-socks5-tunnel 版本锁定：AAR 来自 nange/hev-socks5-tunnel 的 GitHub Release
def hevSocks5TunnelVersion = versionProps.getProperty('hevSocks5TunnelVersion')?.trim()

android {
    namespace = 'com.easysstun'
    compileSdk = 37

    // 签名配置（本地 keystore.properties 或 CI 环境变量）
    if (useLocalKeystore || useCiKeystore) {
        signingConfigs {
            release {
                storeFile useLocalKeystore
                    ? file(keystoreProperties['storeFile'])
                    : rootProject.file(System.getenv("KEYSTORE_FILE") ?: "ci-keystore.jks")
                storePassword useLocalKeystore
                    ? keystoreProperties['storePassword']
                    : System.getenv("KEYSTORE_PASSWORD")
                keyAlias useLocalKeystore
                    ? keystoreProperties['keyAlias']
                    : System.getenv("KEY_ALIAS")
                keyPassword useLocalKeystore
                    ? keystoreProperties['keyPassword']
                    : System.getenv("KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId = "com.easysstun"
        minSdk = 33
        targetSdk 37
        versionCode = versionProps['versionCode'].toInteger()
        versionName = versionProps['versionName']

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    lint {
        checkDependencies = true
        textReport = true
    }

    buildTypes {
        debug {
            resValue "string", "app_name", "EasyssTun (Debug)"
            applicationIdSuffix = ".debug"
        }
        release {
            resValue "string", "app_name", "EasyssTun"
            if (useLocalKeystore || useCiKeystore) {
                signingConfig = signingConfigs.release
            }
        }
    }

    splits {
        abi {
            enable = true
            reset()
            include "arm64-v8a"
            universalApk = false
        }
    }




    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
        resValues = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = '1.4.3'
    }
    buildToolsVersion '36.0.0'
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_25
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def abiFilter = output.filters.find { it.filterType.name() == 'ABI' }
            def abi = abiFilter != null ? abiFilter.identifier : 'all'
            def formattedDate = new Date().format('yyyyMMdd')
            output.outputFileName.set("EasyssTun_v${output.versionName.get()}_${output.versionCode.get()}_${abi}_${variant.name}_${formattedDate}.apk")
        }
    }
}

dependencies {
    implementation(files("libs/libeasyss.aar"))
    implementation(files("libs/hev-socks5-tunnel.aar"))
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.10.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

// ---------------------------------------------------------------------------
// Auto-download libeasyss.aar from nange/easyss latest GitHub release
// if it doesn't exist locally (e.g., in CI / fresh checkout).
// ---------------------------------------------------------------------------
task downloadLibeasyssAar {
    def targetDir = file("libs")
    def targetFile = file("${targetDir}/libeasyss.aar")

    onlyIf {
        !targetFile.exists()
    }

    doLast {
        targetDir.mkdirs()

        def downloadUrl
        def releaseTag

        if (libeasyssVersion) {
            // Version pinned: use direct URL, skip GitHub API call
            releaseTag = libeasyssVersion
            downloadUrl = "https://github.com/nange/easyss/releases/download/${releaseTag}/libeasyss.aar"
            logger.lifecycle("libeasyss.aar not found locally, downloading version ${releaseTag}...")
        } else {
            // No version pinned: fetch latest release via GitHub API
            logger.lifecycle("libeasyss.aar not found locally, downloading from latest release...")

            def apiUrl = "https://api.github.com/repos/nange/easyss/releases/latest"
            def connection = new URL(apiUrl).openConnection()
            connection.setRequestProperty("Accept", "application/vnd.github.v3+json")

            // Use GITHUB_TOKEN for authenticated requests (avoids rate limiting)
            def githubToken = System.getenv("GITHUB_TOKEN")
            if (githubToken) {
                connection.setRequestProperty("Authorization", "Bearer ${githubToken}")
            }

            def responseText = connection.content.text
            def json = new groovy.json.JsonSlurper().parseText(responseText)

            def asset = json.assets.find { it.name == "libeasyss.aar" }
            if (!asset) {
                throw new GradleException(
                    "Asset 'libeasyss.aar' not found in latest release (${json.tag_name}). " +
                    "Available assets: ${json.assets.collect { it.name }}"
                )
            }

            releaseTag = json.tag_name
            downloadUrl = asset.browser_download_url
            logger.lifecycle("Found asset in release ${releaseTag}, downloading from ${downloadUrl}")
        }

        // Download the AAR directly
        try {
            new URL(downloadUrl).openStream().withStream { input ->
                targetFile.withOutputStream { output ->
                    output << input
                }
            }
            logger.lifecycle("Successfully downloaded libeasyss.aar (release: ${releaseTag})")
        } catch (Exception e) {
            throw new GradleException("Failed to download libeasyss.aar: ${e.message}", e)
        }
    }
}

// Trigger download before any build variant (needed for lint, test, and actual builds)
afterEvaluate {
    tasks.named('preBuild').configure { dependsOn downloadLibeasyssAar, downloadHevSocks5TunnelAar }
}

