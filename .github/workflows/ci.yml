name: CI

on:
  push:
    branches: [easyss]
  pull_request:
    branches: [easyss]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action defaults to 'tools platform-tools', but the legacy
          # 'tools' package no longer exists in the SDK repository (cmdline-tools
          # 20 fails to resolve it) and aborts setup. Install platform-tools
          # only; AGP downloads the platform/build-tools it needs.
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run lint and tests
        run: make check
